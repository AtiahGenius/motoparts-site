<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Forgot password - Motify</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="navbar-target"></div>
<main>
  <div class="container">
    <div class="form-card">
      <h2 style="text-align:center;margin-bottom:4px;">Reset your password</h2>
      <p class="lede" style="text-align:center;margin:0 auto 24px;">Enter the email or phone number on your account and we'll send a reset link.</p>
      <form id="forgotForm">
        <div class="field"><label for="contact">Email or phone</label><input type="text" id="contact" placeholder="you@example.com" required></div>
        <button type="submit" class="btn btn-primary btn-block">Send reset link</button>
      </form>
      <p class="form-foot"><a href="login.html">Back to log in</a></p>
    </div>
  </div>
</main>
<div id="footer-target"></div>
<script src="database.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script>
renderNavbar('login');
document.getElementById('forgotForm').addEventListener('submit', e=>{
  e.preventDefault();
  toast("If that account exists, a reset link has been sent.");
  setTimeout(()=> location.href='reset-password.html', 900);
});
</script>
</body>
</html>
