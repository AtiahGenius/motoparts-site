<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Reset password - Motify</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="navbar-target"></div>
<main>
  <div class="container">
    <div class="form-card">
      <h2 style="text-align:center;margin-bottom:4px;">Choose a new password</h2>
      <p class="lede" style="text-align:center;margin:0 auto 24px;">This link is a one-time reset for your account.</p>
      <form id="resetForm">
        <div class="field"><label for="pw1">New password</label><input type="password" id="pw1" required></div>
        <div class="field"><label for="pw2">Confirm new password</label><input type="password" id="pw2" required></div>
        <button type="submit" class="btn btn-primary btn-block">Update password</button>
      </form>
    </div>
  </div>
</main>
<div id="footer-target"></div>
<script src="database.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script>
renderNavbar('login');
document.getElementById('resetForm').addEventListener('submit', e=>{
  e.preventDefault();
  const a = document.getElementById('pw1').value, b = document.getElementById('pw2').value;
  if(a !== b){ toast("Passwords don't match."); return; }
  toast("Password updated. You can log in now.");
  setTimeout(()=> location.href='login.html', 900);
});
</script>
</body>
</html>
