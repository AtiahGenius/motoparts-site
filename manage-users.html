<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Manage users - Motify</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="navbar-target"></div>

<main>
  <div class="container">
    <h1>Manage users</h1>
    <p class="lede">Review accounts, reset credentials, and suspend flagged users.</p>

    <div class="dash-layout">
      <nav class="dash-nav">
        <a href="admin-dashboard.html">Overview</a>
        <a href="vendor-verification.html">Verification</a>
        <a href="manage-categories.html">Categories</a>
        <a href="manage-users.html" class="active">Users</a>
        <a href="reports.html">Reports</a>
      </nav>

      <div>
        <div class="table-wrap"><table>
          <thead><tr><th>Name</th><th>Role</th><th>Phone</th><th>Status</th><th></th></tr></thead>
          <tbody id="userBody"></tbody>
        </table></div>
      </div>
    </div>
  </div>
</main>

<div id="footer-target"></div>

<script src="database.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script>
const user = Auth.requireRole(['admin']);
if(user){
  renderNavbar('manage-users');
  function render(){
    const users = DB.getUsers();
    document.getElementById('userBody').innerHTML = users.map(u=>`
      <tr>
        <td>${u.name}</td>
        <td style="text-transform:capitalize;">${u.role}</td>
        <td>${u.phone||'-'}</td>
        <td><span class="badge ${u.suspended?'badge-closed':'badge-open'}">${u.suspended?'Suspended':'Active'}</span></td>
        <td>
          <button class="btn btn-ghost btn-sm" data-reset="${u.id}">Reset password</button>
          <button class="btn btn-ghost btn-sm" data-suspend="${u.id}" style="color:${u.suspended?'var(--moss)':'var(--rust)'};">${u.suspended?'Reinstate':'Suspend'}</button>
        </td>
      </tr>
    `).join('');
    document.querySelectorAll('[data-suspend]').forEach(btn=>{
      btn.addEventListener('click', ()=>{ DB.suspendUser(btn.dataset.suspend); render(); });
    });
    document.querySelectorAll('[data-reset]').forEach(btn=>{
      btn.addEventListener('click', ()=> toast("Password reset link sent (prototype)."));
    });
  }
  render();
}
</script>
</body>
</html>
