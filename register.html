<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sign up - Motify</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
<div id="navbar-target"></div>

<main>
  <div class="container auth-shell">
    <div class="auth-intro">
      <div class="eyebrow">Start with Motify</div>
      <h1>Parts are easier to find together.</h1>
      <p class="lede">Create an account to save shops, reserve compatible parts, or bring your inventory online.</p>
      <div class="auth-proof"><span>For riders</span><span>For vendors</span><span>Built for Kwabenya</span></div>
    </div>
    <div class="form-card auth-card">
      <h2>Create your account</h2>
      <p class="auth-card-subtitle">Choose how you will use Motify.</p>

      <form id="registerForm">
        <div class="role-pick">
          <label><input type="radio" name="role" value="rider" checked><span>I'm a rider<small>Find and reserve parts</small></span></label>
          <label><input type="radio" name="role" value="vendor"><span>I'm a vendor<small>List and manage stock</small></span></label>
        </div>
        <div class="field"><label for="name">Full name</label><input type="text" id="name" placeholder="Kwame Mensah" required></div>
        <div class="field"><label for="phone">Phone number</label><input type="text" id="phone" placeholder="024 000 0000" required></div>
        <div class="field"><label for="email">Email</label><input type="email" id="email" placeholder="you@example.com" required></div>
        <div class="field"><label for="password">Password</label><input type="password" id="password" placeholder="••••••••" required></div>
        <button type="submit" class="btn btn-primary btn-block">Create Motify account</button>
      </form>
      <p class="form-foot">Already have an account? <a href="login.html" style="color:var(--ink);font-weight:600;">Log in</a></p>
    </div>
  </div>
</main>

<div id="footer-target"></div>

<script src="database.js"></script>
<script src="auth.js"></script>
<script src="app.js"></script>
<script>
renderNavbar('register');

// Pre-select role from ?role=vendor links (e.g. homepage CTA)
if(qs('role')==='vendor'){
  document.querySelector('input[name=role][value=vendor]').checked = true;
}

document.getElementById('registerForm').addEventListener('submit', e=>{
  e.preventDefault();
  const role = document.querySelector('input[name=role]:checked').value;
  const name = document.getElementById('name').value.trim() || "New User";
  const phone = document.getElementById('phone').value.trim();
  const user = Auth.register({ name, phone, role });
  toast(`Account created. Welcome, ${user.name.split(' ')[0]}.`);
  setTimeout(()=>{
    if(role==='vendor') location.href='shop-profile.html?onboarding=1';
    else location.href='rider-dashboard.html';
  }, 600);
});
</script>
</body>
</html>
